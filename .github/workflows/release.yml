name: Release Protocol

on:
  push:
    tags:
      - "protocol/v*"

permissions:
  contents: write

concurrency:
  group: release-protocol-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Protocol release
    runs-on: ubuntu-latest

    env:
      RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect protocol version
        id: detect
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#protocol/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Protocol tag must look like protocol/v4.0.0 or protocol/v4.0.0-rc.1: $TAG_NAME" >&2
            exit 1
          fi

          major="${version%%.*}"
          protocol_dir="protocol/v${major}"
          artifact_name="superbotgo-protocol-${version}.tar.gz"

          if [ ! -d "$protocol_dir" ]; then
            echo "Protocol directory does not exist: $protocol_dir" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "protocol-dir=$protocol_dir"
            echo "artifact-name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test protocol schemas
        run: go test ./...

      - name: Package protocol release
        env:
          PROTOCOL_DIR: ${{ steps.detect.outputs.protocol-dir }}
          ARTIFACT_NAME: ${{ steps.detect.outputs.artifact-name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/${ARTIFACT_NAME}" protocol/README.md "$PROTOCOL_DIR"

      - name: Create GitHub release
        if: env.ACT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ARTIFACT_NAME: ${{ steps.detect.outputs.artifact-name }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" "dist/${ARTIFACT_NAME}" \
            --title "Protocol v${VERSION}" \
            --generate-notes

      - name: Skip GitHub release under act
        if: env.ACT == 'true'
        run: echo "ACT=true; skipping GitHub release publish."

      - name: Skip notification
        if: always() && env.RELEASE_WEBHOOK_URL == ''
        run: echo "RELEASE_WEBHOOK_URL is not configured; skipping notification."

      - name: Send release notification
        if: always() && env.RELEASE_WEBHOOK_URL != ''
        env:
          VERSION: ${{ steps.detect.outputs.version }}
          RELEASE_RESULT: ${{ job.status }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          text="SuperBotGo protocol ${VERSION:-unknown} release ${RELEASE_RESULT}: ${RELEASE_URL}"
          payload="$(jq -n \
            --arg text "$text" \
            --arg component "protocol" \
            --arg version "${VERSION:-unknown}" \
            --arg status "$RELEASE_RESULT" \
            --arg release_url "$RELEASE_URL" \
            --arg run_url "$RUN_URL" \
            '{text: $text, component: $component, version: $version, status: $status, release_url: $release_url, run_url: $run_url}')"

          curl -fsS \
            -H "content-type: application/json" \
            -d "$payload" \
            "$RELEASE_WEBHOOK_URL"
